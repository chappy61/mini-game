<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ミニゲーム</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="stars"></div>
    <div class="game-area" id="gameArea">
        <!-- スタート画面 -->
        <div id="startScreen" class="overlay-screen">
            <div class="start-message">PRESS ENTER TO START</div>
        </div>
        <div class="player" id="player">△</div>
        <div class="hp" id="hpDisplay">HP: 3</div>
        <div class="score" id="scoreDisplay">SCORE: 0</div>
        <div class="guide" id="guide">← →キーで移動してね！</div>
        <div class="game-over" id="gameOver">GAME OVER</div>
        <!-- リザルト画面 -->
        <div id="resultScreen" class="overlay-screen hidden">
            <div class="result-message">
                <div id="finalScore">SCORE: 0</div>
                <div>PRESS R TO RESTART</div>
            </div>
        </div>
    </div>

  <script src="main.js"></script>
</body>
</html>
